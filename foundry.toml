[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./node_modules/@uniswap/v4-periphery/foundry-out" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/uniswap-hooks/=node_modules/@openzeppelin/uniswap-hooks/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "solmate/=node_modules/@uniswap/v4-core/lib/solmate/"
]

[fuzz]
runs = 256
